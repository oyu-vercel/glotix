<app-back-link to="drills" />

@if (drill(); as d) {
  <app-page-header eyebrow="Drill" [title]="d.title" />

  <mat-tab-group class="drill-tabs" animationDuration="120ms">
    <mat-tab [label]="'Words (' + d.words.length + ')'">
      <div class="actions-row">
        <a
          mat-flat-button
          color="primary"
          [routerLink]="['/', pair(), 'drills', d.slug, 'memorize']"
          >{{ targetLabel() }} → {{ nativeLabel() }}</a
        >
        <a
          mat-stroked-button
          color="primary"
          [routerLink]="['/', pair(), 'drills', d.slug, 'memorize']"
          [queryParams]="{ direction: 'native' }"
          >{{ nativeLabel() }} → {{ targetLabel() }}</a
        >
        <a
          mat-stroked-button
          color="primary"
          [routerLink]="['/', pair(), 'drills', d.slug, 'repeat']"
          >Repeat</a
        >
      </div>
      <app-word-table [words]="d.words" />
    </mat-tab>

    <mat-tab [label]="'Patterns (' + d.patterns.length + ')'">
      <div class="actions-row">
        <a
          mat-flat-button
          color="primary"
          [routerLink]="['/', pair(), 'drills', d.slug, 'patterns', 'repeat']"
          >Repeat</a
        >
      </div>
      <app-patterns-table [patterns]="d.patterns" />
    </mat-tab>
  </mat-tab-group>
} @else {
  <p class="loading">Loading...</p>
}
