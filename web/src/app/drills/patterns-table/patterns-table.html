<div class="table-wrap">
  <table mat-table [dataSource]="patterns()" class="patterns-table">
    <ng-container matColumnDef="n">
      <th mat-header-cell *matHeaderCellDef class="col-n">#</th>
      <td mat-cell *matCellDef="let p; let i = index" class="col-n">{{ i + 1 }}</td>
    </ng-container>

    <ng-container matColumnDef="italian">
      <th mat-header-cell *matHeaderCellDef>Italian phrase</th>
      <td mat-cell *matCellDef="let p" class="italian-cell">{{ p.italian }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columns; sticky: true"></tr>
    <tr mat-row *matRowDef="let row; columns: columns"></tr>
  </table>
</div>
