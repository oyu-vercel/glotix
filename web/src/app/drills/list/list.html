<app-page-header eyebrow="Drills" title="Drills" italicAccent="your" />

@if (rows(); as rows) {
  @if (rows.length > 0) {
    <app-progress-table [rows]="rows" [columns]="columns" (rowClick)="navigate($event.id)" />
  } @else {
    <p class="empty">
      No drills yet. Drop a <code>&lt;slug&gt;.csv</code> into a new
      <code>docs/&lt;pair&gt;/drills/&lt;folder&gt;/</code> and run the
      <code>add-drill</code> skill.
    </p>
  }
} @else {
  <p class="loading">Loading...</p>
}
