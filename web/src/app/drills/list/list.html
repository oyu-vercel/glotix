<header class="summary-header">
  <span class="eyebrow">Drills</span>
  <h1><span class="accent-italic">your</span> Drills</h1>
</header>

@if (rows$ | async; as rows) {
  @if (rows.length > 0) {
    <div class="table-wrap">
      <table mat-table [dataSource]="rows" class="summary-table">
        <ng-container matColumnDef="title">
          <th mat-header-cell *matHeaderCellDef>Drill</th>
          <td mat-cell *matCellDef="let r" class="title-cell">{{ r.title }}</td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="columns"></tr>
        <tr
          mat-row
          *matRowDef="let row; columns: columns"
          class="clickable-row"
          tabindex="0"
          (click)="navigate(row.slug)"
          (keyup.enter)="navigate(row.slug)"
        ></tr>
      </table>
    </div>
  } @else {
    <p class="empty">No drills yet. Drop a <code>&lt;slug&gt;.csv</code> into a new <code>docs/drills/&lt;folder&gt;/</code> and run the <code>add-drill</code> skill.</p>
  }
} @else {
  <p class="loading">Loading...</p>
}
