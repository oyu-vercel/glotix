<app-back-link to="books" />

@if (view(); as view) {
  <app-page-header eyebrow="Book" [title]="view.name" />

  @if (view.rows.length > 0) {
    <app-progress-table
      [rows]="view.rows"
      [columns]="columns"
      [totals]="view.totals"
      (rowClick)="open($event.id)"
    />
  } @else {
    <p class="empty">This book has no chapters yet.</p>
  }
} @else {
  <p class="loading">Loading...</p>
}
