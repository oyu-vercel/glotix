<mat-toolbar class="app-toolbar">
  <a class="app-title" routerLink="/">Glotix <span class="app-mark">—</span></a>
  @if (pair(); as pair) {
    <nav class="app-nav">
      <a mat-button [routerLink]="['/', pair, 'vocabulary']" routerLinkActive="active"
        >Vocabulary</a
      >
      <a mat-button [routerLink]="['/', pair, 'stories']" routerLinkActive="active">Stories</a>
      <a mat-button [routerLink]="['/', pair, 'drills']" routerLinkActive="active">Drills</a>
      <a mat-button [routerLink]="['/', pair, 'lessons']" routerLinkActive="active">Lessons</a>
      <a mat-button [routerLink]="['/', pair, 'books']" routerLinkActive="active">Books</a>
    </nav>
    <span class="app-spacer"></span>
    <app-language-switcher />
  }
</mat-toolbar>
<main class="app-shell">
  <router-outlet />
</main>
