<mat-toolbar class="app-toolbar">
  <a class="app-title" routerLink="/">Glotix <span class="app-mark">—</span></a>
  @if (pair(); as pair) {
    <nav class="app-nav">
      @for (feature of features; track feature.segment) {
        <a mat-button [routerLink]="['/', pair, feature.segment]" routerLinkActive="active">{{
          feature.labelPlural
        }}</a>
      }
    </nav>
    <span class="app-spacer"></span>
    <app-language-switcher />
  }
</mat-toolbar>
<main class="app-shell">
  <router-outlet />
</main>
