<app-page-header eyebrow="Stories" title="Stories" italicAccent="your" />

@if (view(); as view) {
  @if (view.rows.length > 0) {
    <app-progress-table
      [rows]="view.rows"
      [columns]="columns"
      [totals]="view.totals"
      (rowClick)="navigate($event.id)"
    />
  } @else {
    <p class="empty">
      No stories yet. Drop a <code>&lt;slug&gt;.txt</code> into a new
      <code>docs/&lt;pair&gt;/stories/&lt;folder&gt;/</code> and run
      <code>npm run build:stories</code>.
    </p>
  }
} @else {
  <p class="loading">Loading...</p>
}
