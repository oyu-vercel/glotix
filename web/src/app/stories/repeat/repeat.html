<div class="repeat-shell">
  <div class="repeat-topbar">
    <a mat-button (click)="exit()">← Exit</a>
    @if (hasCards()) {
      <span class="progress">{{ progress() }}</span>
    }
  </div>

  @if (current(); as card) {
    <article class="card" tabindex="0" (click)="advance()">
      <div class="front">
        <div class="translation">{{ card.translation }}</div>
      </div>
      <div class="hint">Click or press Space for next word</div>
    </article>
  } @else if (category()) {
    <p class="loading">No words in this category.</p>
  } @else {
    <p class="loading">Loading...</p>
  }
</div>
