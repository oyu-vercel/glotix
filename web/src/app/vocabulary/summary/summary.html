<header class="summary-header">
  <h1>Global Vocabulary</h1>
</header>

@if (vocabulary$ | async; as vocabulary) {
  <div class="table-wrap">
    <table mat-table [dataSource]="vocabulary.categories" class="summary-table">
      <ng-container matColumnDef="label">
        <th mat-header-cell *matHeaderCellDef>Category</th>
        <td mat-cell *matCellDef="let c">{{ c.label }}</td>
        <td mat-footer-cell *matFooterCellDef class="footer-label">Total</td>
      </ng-container>

      <ng-container matColumnDef="count">
        <th mat-header-cell *matHeaderCellDef class="count-col">Words</th>
        <td mat-cell *matCellDef="let c" class="count-col">{{ c.words.length }}</td>
        <td mat-footer-cell *matFooterCellDef class="count-col footer-total">
          {{ total(vocabulary.categories) }}
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columns"></tr>
      <tr
        mat-row
        *matRowDef="let row; columns: columns"
        class="clickable-row"
        tabindex="0"
        (click)="navigate(row.key)"
        (keyup.enter)="navigate(row.key)"
      ></tr>
      <tr mat-footer-row *matFooterRowDef="columns" class="totals-row"></tr>
    </table>
  </div>
} @else {
  <p class="loading">Loading...</p>
}
