<app-page-header [eyebrow]="'Vocabulary · ' + level()" title="Categories" italicAccent="all" />

@if (vocabulary(); as vocabulary) {
  <app-progress-table>
    <table mat-table [dataSource]="rows()" class="summary-table">
      <ng-container matColumnDef="label">
        <th mat-header-cell *matHeaderCellDef>Category</th>
        <td mat-cell *matCellDef="let r">{{ r.label }}</td>
        <td mat-footer-cell *matFooterCellDef class="footer-label">
          <span class="accent-italic">Total</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="count">
        <th mat-header-cell *matHeaderCellDef class="num-col">Words</th>
        <td mat-cell *matCellDef="let r" class="num-col">{{ r.count }}</td>
        <td mat-footer-cell *matFooterCellDef class="num-col footer-total">{{ total() }}</td>
      </ng-container>

      <ng-container matColumnDef="total">
        <th mat-header-cell *matHeaderCellDef class="num-col">Total</th>
        <td mat-cell *matCellDef="let r" class="num-col">{{ r.total }}</td>
        <td mat-footer-cell *matFooterCellDef class="num-col footer-total">
          {{ grandTotal() }}
        </td>
      </ng-container>

      <ng-container matColumnDef="percent">
        <th mat-header-cell *matHeaderCellDef class="progress-col">Progress</th>
        <td mat-cell *matCellDef="let r" class="progress-col">
          <div class="progress-cell">
            <div class="progress-track">
              <div class="progress-fill" [style.width.%]="r.percent"></div>
            </div>
            <span class="progress-num">{{ r.percent.toFixed(0) }}%</span>
          </div>
        </td>
        <td mat-footer-cell *matFooterCellDef class="progress-col footer-total">
          <div class="progress-cell">
            <div class="progress-track">
              <div class="progress-fill" [style.width.%]="grandPercent()"></div>
            </div>
            <span class="progress-num">{{ grandPercent().toFixed(1) }}%</span>
          </div>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columns"></tr>
      <tr
        mat-row
        *matRowDef="let row; columns: columns"
        class="clickable-row"
        tabindex="0"
        (click)="navigate(row.key)"
        (keyup.enter)="navigate(row.key)"
      ></tr>
      <tr mat-footer-row *matFooterRowDef="columns" class="totals-row"></tr>
    </table>
  </app-progress-table>
} @else {
  <p class="loading">Loading...</p>
}
