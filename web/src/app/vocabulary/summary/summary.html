<app-page-header
  [eyebrow]="level() ? 'Vocabulary · ' + level() : 'Vocabulary'"
  title="Categories"
  italicAccent="all"
/>

@if (vocabulary()) {
  <app-progress-table
    [rows]="rows()"
    [columns]="columns"
    [totals]="totals()"
    (rowClick)="navigate($event.id)"
  />
} @else {
  <p class="loading">Loading...</p>
}
