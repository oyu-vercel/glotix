<app-page-header eyebrow="vocabularies" title="Vocabulary" italicAccent="your" />

@if (globalSection(); as section) {
  <section class="vocab-section">
    <app-progress-table
      [rows]="section.rows"
      [columns]="globalColumns"
      (rowClick)="navigate($event)"
    />
  </section>
}

@if (storiesSection(); as section) {
  @if (section.rows.length > 0) {
    <section class="vocab-section">
      <h2 class="section-title">Stories</h2>
      <app-progress-table
        [rows]="section.rows"
        [columns]="storyColumns"
        [totals]="section.totals"
        (rowClick)="navigate($event)"
      />
    </section>
  }
}
