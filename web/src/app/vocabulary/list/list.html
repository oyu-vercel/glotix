<header class="summary-header">
  <h1>Vocabulary</h1>
</header>

@if (globalRows$ | async; as globalRows) {
  <section class="vocab-section">
    <div class="table-wrap">
      <table mat-table [dataSource]="globalRows" class="summary-table">
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Source</th>
          <td mat-cell *matCellDef="let r" class="name-cell">{{ r.name }}</td>
        </ng-container>

        <ng-container matColumnDef="count">
          <th mat-header-cell *matHeaderCellDef class="count-col">Words</th>
          <td mat-cell *matCellDef="let r" class="count-col">{{ r.count }}</td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="columns"></tr>
        <tr
          mat-row
          *matRowDef="let row; columns: columns"
          class="clickable-row"
          tabindex="0"
          (click)="navigate(row)"
          (keyup.enter)="navigate(row)"
        ></tr>
      </table>
    </div>
  </section>
}

@if (storyRows$ | async; as storyRows) {
  @if (storyRows.length > 0) {
    <section class="vocab-section">
      <h2 class="section-title">Stories</h2>
      <div class="table-wrap">
        <table mat-table [dataSource]="storyRows" class="summary-table">
          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef>Story</th>
            <td mat-cell *matCellDef="let r" class="name-cell">{{ r.name }}</td>
          </ng-container>

          <ng-container matColumnDef="count">
            <th mat-header-cell *matHeaderCellDef class="count-col">Words</th>
            <td mat-cell *matCellDef="let r" class="count-col">{{ r.count }}</td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="columns"></tr>
          <tr
            mat-row
            *matRowDef="let row; columns: columns"
            class="clickable-row"
            tabindex="0"
            (click)="navigate(row)"
            (keyup.enter)="navigate(row)"
          ></tr>
        </table>
      </div>
    </section>
  }
}
