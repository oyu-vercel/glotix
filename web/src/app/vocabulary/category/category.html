<div class="back-row">
  <a mat-button routerLink="/vocabulary/a2">← Back</a>
</div>

@if (category(); as category) {
  <header class="cat-header">
    <h1>{{ category.label }}</h1>
    <span class="count-pill">{{ category.words.length }}</span>
    <span class="spacer"></span>
    <span class="memorize-actions">
      <a mat-stroked-button color="primary"
         [routerLink]="['/category', category.key, 'memorize']">Italian → Russian</a>
      <a mat-stroked-button color="primary"
         [routerLink]="['/category', category.key, 'memorize']"
         [queryParams]="{ direction: 'russian' }">Russian → Italian</a>
      <a mat-stroked-button color="primary"
         [routerLink]="['/category', category.key, 'repeat']">Repeat</a>
    </span>
  </header>

  <app-word-table [words]="category.words" />
} @else {
  <p class="loading">Category not found.</p>
}
