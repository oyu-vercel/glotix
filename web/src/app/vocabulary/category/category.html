<app-back-link to="vocabulary" [extraSegments]="['summary']" labelOverride="Back" />

@if (category(); as category) {
  <header class="cat-header">
    <div class="cat-headline">
      <span class="eyebrow">Category</span>
      <h1>{{ category.label }}</h1>
    </div>
    <span class="count-pill">{{ category.words.length }}</span>
  </header>

  <div class="memorize-actions">
    <a
      mat-flat-button
      color="primary"
      class="primary-action"
      [routerLink]="['/', pair(), 'category', category.key, 'memorize']"
      >{{ targetLabel() }} → {{ nativeLabel() }}</a
    >
    <a
      mat-stroked-button
      color="primary"
      [routerLink]="['/', pair(), 'category', category.key, 'memorize']"
      [queryParams]="{ direction: 'native' }"
      >{{ nativeLabel() }} → {{ targetLabel() }}</a
    >
    <a
      mat-stroked-button
      class="sage-action"
      [routerLink]="['/', pair(), 'category', category.key, 'repeat']"
      >Repeat</a
    >
  </div>

  <app-word-table [words]="category.words" />
} @else {
  <p class="loading">Category not found.</p>
}
