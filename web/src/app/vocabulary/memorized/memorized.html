<app-page-header eyebrow="Progress" title="Memorized" italicAccent="your" />

@if (rows().length > 0) {
  <app-progress-table
    [rows]="rows()"
    [columns]="columns"
    [totals]="totals()"
    (rowClick)="navigate($event.id)"
  />
} @else {
  <div class="empty-state">
    <p>
      No memorized words yet. Mark a word as <strong>Memorized</strong> on the cards screen to add
      it here.
    </p>
  </div>
}
