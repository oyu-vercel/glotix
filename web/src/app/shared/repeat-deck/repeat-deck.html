<app-deck-shell
  [progress]="cursor.progress()"
  [hasCards]="cursor.hasCards()"
  [isEmpty]="!!category()"
  [emptyMessage]="emptyMessage()"
  (exit)="exit.emit()"
  (cardClick)="cursor.advance()"
>
  <div card class="slot">
    @if (cursor.current(); as card) {
      <div class="card-actions" (click)="$event.stopPropagation()">
        <button mat-stroked-button type="button" (click)="markMemorized()">Memorized</button>
      </div>
      <div class="front">
        <div class="translation">{{ card.translation }}</div>
      </div>
      <div class="hint">Click or press Space for next word</div>
    }
  </div>
</app-deck-shell>
