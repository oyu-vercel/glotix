<app-deck-shell
  [progress]="cursor.progress()"
  [hasCards]="cursor.hasCards()"
  [isEmpty]="patterns().length === 0"
  emptyMessage="No patterns to practise."
  (exit)="exit.emit()"
  (cardClick)="cursor.advance()"
>
  <div card class="slot">
    @if (cursor.current(); as card) {
      <div class="face">
        <div class="target">{{ card.target }}</div>
        <div class="divider"></div>
        <div class="native">{{ card.native }}</div>
      </div>
      <div class="hint">Click or press Space for next pattern</div>
    }
  </div>
</app-deck-shell>
