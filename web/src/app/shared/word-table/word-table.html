<div class="table-wrap">
  <table mat-table [dataSource]="words()" class="vocab-table">
    <ng-container matColumnDef="n">
      <th mat-header-cell *matHeaderCellDef class="col-n">#</th>
      <td mat-cell *matCellDef="let w" class="col-n">{{ w.n }}</td>
    </ng-container>

    <ng-container matColumnDef="italian">
      <th mat-header-cell *matHeaderCellDef>Word</th>
      <td mat-cell *matCellDef="let w" class="italian-cell">{{ w.italian }}</td>
    </ng-container>

    <ng-container matColumnDef="pronunciation">
      <th mat-header-cell *matHeaderCellDef>Pronunciation</th>
      <td mat-cell *matCellDef="let w" class="pron-cell">{{ w.pronunciation }}</td>
    </ng-container>

    <ng-container matColumnDef="translation">
      <th mat-header-cell *matHeaderCellDef>Translation</th>
      <td mat-cell *matCellDef="let w">{{ w.translation }}</td>
    </ng-container>

    <ng-container matColumnDef="examples">
      <th mat-header-cell *matHeaderCellDef>Examples</th>
      <td mat-cell *matCellDef="let w" class="examples-cell">{{ w.examples }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columns; sticky: true"></tr>
    <tr mat-row *matRowDef="let row; columns: columns"></tr>
  </table>
</div>
