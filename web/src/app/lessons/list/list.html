<app-page-header [eyebrow]="targetLabel()" title="Lessons" italicAccent="your" />

@if (rows(); as rows) {
  @if (rows.length > 0) {
    <app-progress-table [rows]="rows" [columns]="columns" (rowClick)="navigate($event.id)" />
  } @else {
    <p class="empty">No lessons yet.</p>
  }
} @else {
  <p class="loading">Loading...</p>
}
